[pytest]
testpaths = tests
# Lets tests import the "app" package without installing it.
pythonpath = .
# -rs: always print WHY a test was skipped (e.g. database not running), so skips are never silent.
addopts = -rs
markers =
    live_ai: talks to a real Ollama server; skipped unless RUN_LIVE_AI_TESTS=1
    db: needs the PostgreSQL test database (docker compose up -d); skipped if unreachable
