# CI: on every push and pull request, check that the project still installs, passes lint and tests,
# has no known vulnerable dependencies, and that both Docker images still build.
# Nothing is deployed from here. Costs nothing on public repositories (GitHub-hosted runners).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    # Stop a stuck run after 15 minutes instead of waiting for GitHub's 6-hour limit.
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: support
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: support
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U support" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
    env:
      # Throw-away values for the CI database only. Real secrets never go in this file.
      POSTGRES_PASSWORD: ci-only-password
      JWT_SECRET_KEY: ci-only-secret-key-that-is-at-least-32-characters
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Create the test database
        run: PGPASSWORD=ci-only-password psql -h localhost -p 5433 -U support -d support -c "CREATE DATABASE support_test"
      - name: Migrations apply cleanly on an empty database
        run: alembic upgrade head && alembic check
      - name: Tests (the LLM is faked; no Ollama needed)
        # --timeout-method=thread: if a test hangs, print where every thread is stuck and end the run,
        # so the job finishes and its log is kept.
        # The memory cap and the hard kill stop a runaway test before it can freeze the whole runner.
        run: |
          ulimit -v 8000000
          timeout -k 10 480 pytest -v --timeout=60 --timeout-method=thread
        timeout-minutes: 10
      - name: Runner resources (for debugging)
        if: always()
        run: |
          free -m
          df -h /
          docker stats --no-stream
      - name: Known vulnerabilities in Python dependencies
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Type-check and build
        run: npm run build
      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -t ai-support-backend ./backend
      - name: Build the frontend image
        run: docker build -t ai-support-frontend ./frontend
