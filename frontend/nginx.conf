server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: any unknown path (e.g. /tickets/123) returns index.html, and React Router shows the page.
    location / {
        try_files $uri /index.html;
    }

    # Built files have a content hash in their name, so they can be cached "forever".
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Basic browser security headers.
    # CSP: scripts, styles and images only from this site; API calls only to this site and the API.
    # An injected <script> from anywhere else won't run. ${API_ORIGIN} is filled in when the container starts.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ${API_ORIGIN}; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
